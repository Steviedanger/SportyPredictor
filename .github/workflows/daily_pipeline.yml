name: SportyPredictor Daily Pipeline

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase python-dotenv

      - name: Run Daily Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run:    |
          test -n "$SUPABASE_URL" && echo "SUPABASE_URL is set" || echo "SUPABASE_URL is EMPTY"
          test -n "$SUPABASE_KEY" && echo "SUPABASE_KEY is set" || echo "SUPABASE_KEY is EMPTY"
          test -n "$FOOTBALL_DATA_API_KEY" && echo "FOOTBALL_DATA_API_KEY is set" || echo "FOOTBALL_DATA_API_KEY is EMPTY"
          python main.py